aid: ipkit-dev

name: IPKit

image: https://ipkit.dev/og.png

description: IPKit provides a simple API to retrieve IP address information. The service returns JSON data about the queried IP, including geolocation,
  ISP, and security details, wrapping data from the ipregistry service. It is designed for developers needing quick IP lookups without authentication,
  supporting public access via the root endpoint. IPKit aims to offer reliable, low-latency IP data for integration into applications, analytics,
  and security tools.

